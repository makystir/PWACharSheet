<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>WFRP 4e Character Sheet</title>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <script>
      // Apply saved theme before React renders to prevent flash
      try { var t = localStorage.getItem('wfrp-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e) {}
    </script>
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-primary,#121212);pointer-events:none;transition:opacity 300ms ease;">
      <style>
        #splash svg { width: 64px; height: 62px; margin-bottom: 16px; }
        #splash p { margin: 0 0 24px; font-family: 'Cinzel', Georgia, serif; font-size: 1.25rem; color: var(--parchment, #c8a96e); text-align: center; letter-spacing: 0.02em; }
        #splash .pulse-loader { width: 40px; height: 4px; border-radius: 2px; background: var(--parchment, #c8a96e); opacity: 0.6; animation: splash-pulse 1.2s ease-in-out infinite; }
        @keyframes splash-pulse { 0%, 100% { opacity: 0.3; transform: scaleX(0.6); } 50% { opacity: 0.8; transform: scaleX(1); } }
        @media (prefers-reduced-motion: reduce) { #splash .pulse-loader { animation: none; opacity: 0.6; } }
      </style>
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" fill="none" viewBox="0 0 48 46"><path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/></svg>
      <p>WFRP 4e Character Sheet</p>
      <div class="pulse-loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
