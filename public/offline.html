<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – WFRP 4e Character Sheet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #d4c4a0;
      background: #121212;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 420px;
      padding: 40px 32px;
      background: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 8px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Cinzel', Georgia, serif;
      color: #c8a96e;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      color: #a89878;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .home-link {
      display: inline-block;
      padding: 10px 24px;
      background: #c8a84c;
      color: #121212;
      text-decoration: none;
      border-radius: 4px;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .home-link:hover {
      opacity: 0.9;
    }

    .home-link:focus {
      outline: 2px solid #c8a84c;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">⚔️</div>
    <h1>Content Unavailable Offline</h1>
    <p>The page you requested isn't available without a network connection. Return to the character sheet to access cached content.</p>
    <a href="/PWACharSheet/" class="home-link">Return to Character Sheet</a>
  </div>
</body>
</html>
